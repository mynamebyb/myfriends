name: GameRecorder Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos + SDK
        run: |
          export THEOS="${{ runner.temp }}/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # 直接软链 Xcode 自带 SDK，禁止 install-theos 下载 patched SDK
          mkdir -p "$THEOS/sdks"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sfn "$SDK" "$THEOS/sdks/$(basename "$SDK")"
          ls -la "$THEOS/sdks"
          brew install ldid

      - name: Build
        working-directory: GameRecorder
        run: |
          make clean || true
          make

      - name: Verify
        working-directory: GameRecorder
        run: |
          find .theos -name "*.dylib" -exec file {} \;

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: GameRecorder.dylib
          path: GameRecorder/.theos/obj/debug/**/*.dylib
          if-no-files-found: error
