name: Build GameRecorder
on:
  push:
    paths:
      - 'GameRecorder/**'
      - '.github/workflows/gamerecorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/work/_temp/theos
          key: theos-v2
      - name: Setup Theos
        run: |
          export THEOS="/Users/runner/work/_temp/theos"
          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            git clone --single-branch --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          brew install ldid xz || true
      - name: Symlink SDK
        run: |
          export THEOS="/Users/runner/work/_temp/theos"
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          sudo mkdir -p "$THEOS/sdks"
          sudo ln -sf "$SDKPATH" "$THEOS/sdks/iPhoneOS17.5.sdk"
      - name: Build
        run: |
          export THEOS="/Users/runner/work/_temp/theos"
          rm -rf GameRecorder/.theos
          cd GameRecorder && make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GameRecorder.dylib
          path: GameRecorder/.theos/obj/debug/**/*.dylib
          if-no-files-found: error
