name: Build dylib (Theos)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS="${{ runner.temp }}/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          brew install ldid xz

      - name: Use Xcode bundled iPhoneOS SDK
        run: |
          export THEOS="${{ runner.temp }}/theos"
          mkdir -p "$THEOS/sdks"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK"
          ln -sfn "$SDK" "$THEOS/sdks/$(basename "$SDK")"

      - name: Build HideLabelOnRecord
        run: |
          make clean || true
          make

      - name: Build GameRecorder
        working-directory: GameRecorder
        run: |
          make clean || true
          make

      - name: Verify GameRecorder
        working-directory: GameRecorder
        run: |
          find .theos -name "*.dylib" -exec file {} \;
          nm -gU .theos/obj/debug/arm64/libGameRecorder.dylib | grep -i constructor || true

      - name: Upload HideLabelOnRecord
        uses: actions/upload-artifact@v4
        with:
          name: HideLabelOnRecord.dylib
          path: .theos/obj/debug/**/*.dylib
          if-no-files-found: error

      - name: Upload GameRecorder
        uses: actions/upload-artifact@v4
        with:
          name: GameRecorder.dylib
          path: GameRecorder/.theos/obj/debug/**/*.dylib
          if-no-files-found: error
